name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # The URL hash is the sole source of truth (docs/adr/0002). Production
      # code must never reach for localStorage; the only matches allowed are
      # comments explaining that, and the tests that assert it stays true.
      - name: No localStorage in production code
        run: |
          if grep -rn "localStorage" src --include='*.ts' --include='*.tsx' \
               | grep -v '\.test\.' | grep -vE '^\s*[^:]+:[0-9]+:\s*(\*|//|/\*)'; then
            echo "::error::localStorage used in production code — see docs/adr/0002-url-sole-source-of-truth.md"
            exit 1
          fi

  # Browser-level acceptance tests. Separate job: it needs a browser download,
  # and a red e2e run should be legible on its own rather than buried at the
  # end of the unit job.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright acceptance tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Traces and failure screenshots; `trace: retain-on-failure` means this
      # is only populated when something actually went wrong.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14
